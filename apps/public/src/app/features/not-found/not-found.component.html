<div class="not-found-page-container">
  <!-- Header Compartido -->
  <app-header [(mobileMenuOpen)]="mobileMenuOpen"></app-header>

  <!-- Breadcrumb -->
  <app-breadcrumb [items]="breadcrumbs"></app-breadcrumb>

  <!-- Wallpaper y Fondo -->
  <div class="not-found-wallpaper-body app-wallpaper-body">
    <div class="ambient-overlay"></div>

    <main class="not-found-main-content">
      <div class="not-found-wrapper">
        <div class="not-found-section-card">
          <div class="card-inner-header">
            <span class="error-visual-number">404</span>
            <span class="error-kicker">COORDENADAS NO ENCONTRADAS</span>
            <h1 class="card-heading">Esta senda no conduce a ninguna expedición</h1>
            <p class="card-subheading">
              La coordenada o ruta que intentás explorar no existe, cambió de trazado o se encuentra
              fuera de la cartografía oficial de <strong>Club de Experiencias</strong>.
            </p>
          </div>

          <div class="navigation-actions-group">
            <a routerLink="/" class="cta-primary-btn">
              <span>Volver al inicio</span>
            </a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Footer Compartido -->
  <app-footer />
</div>
